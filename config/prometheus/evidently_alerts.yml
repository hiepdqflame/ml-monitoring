# Actionable rules for a small hourly-monitoring demo.
groups:
  - name: availability
    rules:
      - alert: APIDown
        expr: up{job="model-api"} == 0
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Prediction API has been unreachable for one minute"
          description: "Check docker compose ps and API logs; restore with docker compose start api."
      - alert: EvidentlyServiceDown
        expr: up{job="evidently"} == 0
        for: 1m
        labels:
          severity: critical
          component: evidently
        annotations:
          summary: "Evidently has been unreachable for one minute"
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
          component: alertmanager
        annotations:
          summary: "Alertmanager is unreachable; inspect Prometheus directly"
  - name: predictions
    rules:
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, sum by (le) (rate(api_request_latency_seconds_bucket{endpoint="/predict"}[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Prediction P95 latency is above 500 ms"
      - alert: HighAPIErrorRate
        expr: sum(rate(api_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(api_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "More than 5 percent of API requests return 5xx"
  - name: data_quality
    rules:
      - alert: DataDriftDetected
        expr: evidently_data_drift_detected == 1
        for: 2m
        labels:
          severity: warning
          component: evidently
        annotations:
          summary: "The latest analyzed feature window has sustained drift"
          description: "Inspect the Evidently report and Airflow decision. Retraining the same Wine data does not resolve drift."
      - alert: HighMissingValues
        expr: evidently_missing_values_ratio > 0.2
        for: 5m
        labels:
          severity: warning
          component: evidently
        annotations:
          summary: "A monitored feature has more than 20 percent missing values"
